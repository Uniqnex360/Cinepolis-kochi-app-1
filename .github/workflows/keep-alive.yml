
name: Keep-Alive Ping

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping KOCHI1 Backend
        run: |
          curl -s -f -m 60 "https://kochi1-backend-pejx.onrender.com/v1/health" || echo "KOCHI1 ping failed or waking up"

      - name: Ping Vybh Core Monolith
        run: |
          curl -s -f -m 60 "https://booking-app-backend-wp46.onrender.com/health" || echo "Vybh ping failed or waking up"
